spring.application.name=makeup

# Configuration MySQL XAMPP par defaut. Les variables d'environnement peuvent remplacer ces valeurs.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/makeup?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# Les tables sont gerees par MySQL/migrations; evite de bloquer le demarrage
# avec une operation DDL automatique sur une base partagee.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8081}
spring.data.rest.base-path=/makeup

# JWT (la cle ne doit pas etre committee en production).
app.security.jwt-secret=${JWT_SECRET:change-this-development-secret-key-to-at-least-32-characters}
app.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:864000000}

# Envoi des emails de verification.
# Renseigner MAIL_USERNAME et MAIL_PASSWORD (mot de passe d'application Gmail) pour un envoi reel.
spring.mail.default-encoding=UTF-8
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${spring.mail.username}}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
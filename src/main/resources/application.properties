spring.application.name=makeup

# Configuration MySQL XAMPP par defaut. Les variables d'environnement peuvent remplacer ces valeurs.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/makeup?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
spring.data.rest.base-path=/makeup